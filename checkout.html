<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - Pay & Verify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs (v8 matching index.html) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-50 font-sans">

    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col justify-between p-6">
        
        <!-- Header -->
        <div>
            <div class="text-center mb-6">
                <h1 class="text-xl font-bold text-slate-800" id="shopName">Loading...</h1>
                <p class="text-sm text-slate-500">Invoice Amount</p>
                <h2 class="text-3xl font-extrabold text-emerald-600 mt-1" id="billAmount">₹0</h2>
            </div>

            <!-- Payment Box -->
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 text-center mb-6 shadow-sm">
                <p class="text-sm font-medium text-slate-600 mb-3">Is QR Code ko kisi bhi UPI App se scan karein:</p>
                
                <!-- QR Code Image -->
                <div class="bg-white p-3 inline-block rounded-xl border border-slate-200 shadow-inner mb-3">
                    <img id="qrCodeImg" src="https://via.placeholder.com/180" alt="UPI QR Code" class="w-44 h-44 mx-auto object-contain">
                </div>
                
                <p class="text-xs text-slate-500">UPI ID: <span id="upiIdText" class="font-semibold text-slate-700">loading...</span></p>
            </div>

            <!-- UTR Submission Form -->
            <div id="utrFormSection" class="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-6">
                <h3 class="text-sm font-bold text-amber-800 mb-1">Payment karne ke baad yahan UTR dalein:</h3>
                <p class="text-xs text-amber-600 mb-3">Payment successful hone ke baad 12-digit UTR/Reference Number yahan enter karein.</p>
                
                <input type="text" id="utrInput" placeholder="Enter 12-digit UTR Number" maxlength="12" class="w-full px-4 py-3 border border-amber-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-center font-mono text-lg tracking-wider bg-white mb-3">
                
                <button onclick="submitUtr()" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md">
                    Submit UTR & Verify
                </button>
            </div>
        </div>

        <!-- Footer Status Message -->
        <div id="statusMessage" class="text-center text-sm text-slate-500 pb-2">
            Status: Waiting for payment...
        </div>

    </div>

    <script>
        // Firebase Configuration (Matching index.html)[span_1](start_span)[span_1](end_span)
        const firebaseConfig = {
            apiKey: "AIzaSyDI1bnT0cyKVHyH25PbIZqJfWFhuZlc2YA",
            authDomain: "sagar-invoice-app.firebaseapp.com",
            databaseURL: "https://sagar-invoice-app-default-rtdb.firebaseio.com",
            projectId: "sagar-invoice-app",
            storageBucket: "sagar-invoice-app.firebasestorage.app",
            messagingSenderId: "733494306894",
            appId: "1:733494306894:web:cbab88d65b1dbd08bcbb1f"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // URL Parameters expected: checkout.html?user=USER_UID&invoice=INVOICE_ID
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user');
        const invoiceId = urlParams.get('invoice');

        let invoiceDataRef = null;

        if (!userId || !invoiceId) {
            alert("Invalid Invoice Link!");
            document.getElementById('statusMessage').innerText = "Error: Invalid link parameters.";
        } else {
            invoiceDataRef = database.ref('user_invoices/' + userId);
            loadInvoiceDetails();
        }

        function loadInvoiceDetails() {
            invoiceDataRef.once('value', (snapshot) => {
                const invoices = snapshot.val() || [];
                const inv = invoices.find(i => String(i.id) === String(invoiceId));

                if (inv) {
                    const totalAmt = (inv.items || []).reduce((s, item) => s + (item.qty * item.price), 0);
                    document.getElementById('shopName').innerText = inv.from || "My Dukaan";
                    document.getElementById('billAmount').innerText = "₹" + totalAmt;
                    
                    // Aap default UPI ID yahan set kar sakte hain ya invoice object se le sakte hain
                    const upiId = inv.upiId || "merchant@upi";
                    document.getElementById('upiIdText').innerText = upiId;
                    
                    document.getElementById('qrCodeImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=${upiId}&pn=${encodeURIComponent(inv.from || 'Dukaan')}&am=${totalAmt}&cu=INR`;

                    if (inv.status === "Pending Verification") {
                        document.getElementById('utrFormSection').style.display = 'none';
                        document.getElementById('statusMessage').innerHTML = `<span class='text-amber-600 font-bold'>⏳ UTR Submitted (${inv.utrNumber || ''}). Waiting for merchant approval.</span>`;
                    } else if (inv.status === "PAID") {
                        document.getElementById('utrFormSection').style.display = 'none';
                        document.getElementById('statusMessage').innerHTML = "<span class='text-emerald-600 font-bold'>✅ Payment Verified & Approved! Thank you.</span>";
                    }
                } else {
                    alert("Invoice not found in database!");
                }
            }, (error) => {
                console.error("Error loading invoice:", error);
                alert("Failed to load invoice details.");
            });
        }

        window.submitUtr = function() {
            const utr = document.getElementById('utrInput').value.trim();
            if (utr.length < 12) {
                alert("Kripya poora 12-digit UTR number dalein.");
                return;
            }

            document.getElementById('submitBtn').innerText = "Submitting...";
            document.getElementById('submitBtn').disabled = true;

            invoiceDataRef.once('value', (snapshot) => {
                let invoices = snapshot.val() || [];
                let found = false;

                invoices = invoices.map(inv => {
                    if (String(inv.id) === String(invoiceId)) {
                        found = true;
                        inv.status = "Pending Verification";
                        inv.utrNumber = utr;
                        inv.submittedAt = new Date().toISOString();
                    }
                    return inv;
                });

                if (found) {
                    invoiceDataRef.set(invoices).then(() => {
                        document.getElementById('statusMessage').innerHTML = "<span class='text-emerald-600 font-bold'>✓ UTR Submitted Successfully! Waiting for merchant approval.</span>";
                        document.getElementById('utrFormSection').style.display = 'none';
                    }).catch(err => {
                        alert("Error saving UTR: " + err.message);
                        document.getElementById('submitBtn').innerText = "Submit UTR & Verify";
                        document.getElementById('submitBtn').disabled = false;
                    });
                } else {
                    alert("Invoice update error.");
                    document.getElementById('submitBtn').innerText = "Submit UTR & Verify";
                    document.getElementById('submitBtn').disabled = false;
                }
            });
        }
    </script>
</body>
</html>
